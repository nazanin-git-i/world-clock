<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>World Clock - Nazanin Mehboudi</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>
      <select name="" id="">
        <option value="">Select a city</option>
        <option value="London">London</option>
        <option value="New York">New York</option>
        <option value="Tokyo">Auckland</option>
      </select>

      <div class="city"></div>
      <h2>Los Angeles 🇺🇸</h2>
      <div class="date">May 22th 2026</div>
      <div class="time">14:05:30 PM</div>
    </div>

     <div class="city"></div>
      <h2>Sydney 🇦🇺</h2>
      <div class="date">May 22th 2026</div>
      <div class="time">14:05:30 PM</div>
    </div>

    <footer>
      This project was coded with ❤️ by Nazanin Mehboudi and is
      <a href="#" target="_blank">open-sourced on GitHub</a>.
    </footer>
    <script src="javascript/index.js"></script>
  </body>
</html>
